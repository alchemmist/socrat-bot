name: Socrat bot release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: socrat_test
          POSTGRES_USER: socrat_test
          POSTGRES_PASSWORD: socrat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socrat_test -d socrat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://socrat_test:socrat_test@localhost:5432/socrat_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run pytest
        run: |
          pip install -e '.[dev]' pytest httpx ruff
          ruff check src/socrat_bot/media.py tests/test_media.py alembic/versions/0015_alert_images.py src/socrat_bot/mailing_list.py tests/test_mailing_list.py alembic/versions/0014_broadcast_copy_time.py src/socrat_bot/mailing.py alembic/versions/0013_broadcast_copies.py tests/test_mailing_edit.py src/socrat_bot/commands.py tests/test_commands.py src/socrat_bot/escalation.py src/socrat_bot/delivery.py src/socrat_bot/db.py tests/test_escalation.py tests/conftest.py tests/test_migrations.py alembic/versions/0010_escalation.py alembic/versions/0011_delivery_ownership.py alembic/versions/0012_alerts_approval.py
          ruff check --isolated --select E4,E7,E9,F src/socrat_bot/app.py src/socrat_bot/cards.py src/socrat_bot/logic.py src/socrat_bot/models.py alembic/env.py
          python -m compileall -q src tests alembic
          pytest -q

  publish-and-deploy:
    name: Publish Harbor image and deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: socrat-bot-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.socrat.alchemmist.xyz
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/socrat-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}
