# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph
'on':
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-freshness:
    name: Quality Graph declaration freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - run: uv run qg validate
        name: Run Quality Graph declaration freshness
        id: quality-command
        continue-on-error: true
      - name: Collect Quality Graph declaration freshness result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: graph-freshness
          title: Quality Graph declaration freshness
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: e0daad10369c78f4566a606a65ab03fe3f4ea357c3aa9dd080ec650e4cdb3b5f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Quality Graph declaration freshness result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-graph-freshness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph-freshness.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Quality Graph declaration freshness result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 5
  n8n-card-links:
    name: Safe n8n card links and existing card regressions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - run: 'uv run ruff check --isolated --select E4,E7,E9,F src/socrat_bot/cards.py tests/test_n8n_links.py

          uv run pytest -q tests/test_cards.py tests/test_n8n_links.py

          '
        name: Run Safe n8n card links and existing card regressions
        id: quality-command
        continue-on-error: true
      - name: Collect Safe n8n card links and existing card regressions result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: n8n-card-links
          title: Safe n8n card links and existing card regressions
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: e0daad10369c78f4566a606a65ab03fe3f4ea357c3aa9dd080ec650e4cdb3b5f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Safe n8n card links and existing card regressions result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-n8n-card-links-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/n8n-card-links.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Safe n8n card links and existing card regressions result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 5
  full-regressions:
    name: Full bot regressions with isolated PostgreSQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - run: uv run pytest -q
        name: Run Full bot regressions with isolated PostgreSQL
        id: quality-command
        continue-on-error: true
      - name: Collect Full bot regressions with isolated PostgreSQL result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: full-regressions
          title: Full bot regressions with isolated PostgreSQL
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: e0daad10369c78f4566a606a65ab03fe3f4ea357c3aa9dd080ec650e4cdb3b5f
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Full bot regressions with isolated PostgreSQL result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-full-regressions-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/full-regressions.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Full bot regressions with isolated PostgreSQL result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    needs:
      - n8n-card-links
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://socrat_test@localhost:5432/socrat_test
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: socrat_test
          POSTGRES_USER: socrat_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U socrat_test -d socrat_test" --health-interval 5s --health-timeout 5s --health-retries 10
