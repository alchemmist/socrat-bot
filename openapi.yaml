# Internal contract for processes that integrate with Socrat Bot.
openapi: 3.0.3
info:
  title: Socrat Bot
  version: 1.0.0
  description: |
    Внутренний API бота Socrat. Через него другие процессы кластера
    отправляют карточки алертов, дописывают ссылки и ставят служебные задачи.
    Публично доступен только webhook Telegram.
    /unsubscribe и кнопка Unsubscribe отключают доставку, сохраняя одобрение владельца.
    Повторная подписка через /start не требует нового одобрения и не рассылает старые алерты.
    Если задан ACTION_WEBHOOK_URL, бот после кнопки шлёт POST: vpn.opt_in, alerts.approved или alert.muted. Без адреса события наружу не уходят.
servers:
  - url: http://socrat-bot.socrat-bot.svc:8080
    description: Внутренний адрес бота в кластере
  - url: https://bot.socrat.alchemmist.xyz
    description: Публичный ingress, только /telegram/webhook
security:
  - internalToken: []
tags:
  - name: alerts
    description: Карточки алертов и ссылки на них
  - name: messages
    description: Обычные сообщения Telegram
  - name: vpn
    description: Привязка клиента панели
  - name: telegram
    description: Вход от Telegram
  - name: health
    description: Проверка процесса
paths:
  /v1/messages:
    post:
      tags: [alerts, messages]
      operationId: postMessage
      summary: Отправить сообщение или карточку алерта
      description: |
        Этот метод вызывает workflow алертов. Один запрос — один алерт.
        Новая firing generation отправляется одобренным подписчикам с receive_level >= level.
        Начальный level — максимум ALERT_LEVELS (по умолчанию 20); Escalate понижает на один tier.
        Повторы/Resolved обновляют только доставленные копии текущей generation, даже после disable.
        Изменение receive_level не переигрывает активные инциденты; эскалация явно допускает новых получателей.
        Начальный снимок получателей и delivery intents коммитятся вместе с инцидентом до Telegram HTTP.
        Ошибка первой отправки или restart не теряет исходных получателей; поздние подписчики не добавляются.
        Webhook, outbox, SPI, notes и mute используют общий DB lease на копию и content revisions;
        новые тексты/аннотации не теряются при запросе в полёте. DB transaction во время HTTP не удерживается.
        Без получателей возвращается copies: [], без fallback на chat_id.
        Если получатели есть, но доставка никому не завершена, возвращается 502 с durable retry.
        При частичном успехе copies содержит завершённые копии.
        Поле chat_id в этом случае не выбирает получателей.
        images работает с card, alert и singleton alerts, но не с обычным text (400).
        До 3 inline PNG/JPEG, strict canonical base64, до 4 MiB decoded каждый (12 MiB суммарно).
        URL не принимаются и не загружаются; скриншоты генерирует вызывающий процесс.
        Фото отправляется multipart sendPhoto ответом на исходную текстовую карточку,
        allow_sending_without_reply=false. Текст/кнопки/ID карточки не меняются.
        attachments содержит status pending/sent/superseded по каждому получателю и слоту; успех текста
        не означает успех фото. Ошибки фото сохраняют независимый durable retry после restart.
        Изменение bytes в слоте редактирует прежнее фото (editMessageMedia); ошибка edit не вызывает resend.
        Одинаковые bytes дедуплицируются. Отсутствующее/null/пустое images ничего не удаляет;
        более короткий список сохраняет прежние оставшиеся слоты. Новая generation начинает без фото.
        Фото получают только исходные admitted intents текущей generation и новые intents эскалации;
        перед HTTP проверяется alerts_enabled. Изменение настроек не создаёт backlog.
        Lease finite, ownership fenced; Telegram accepted-but-untracked может дать повтор после timeout,
        exactly-once не гарантируется. Payload images не возвращается в list API.
        Повтор того же алерта правит уже отправленную карточку. Resolved дописывается
        в ту же строку, что и название. Следующее срабатывание после закрытия создаёт новое сообщение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
            examples:
              alert:
                summary: Один алерт из Alertmanager
                value:
                  chat_id: 891074228
                  alert:
                    status: firing
                    labels:
                      alertname: TargetDown
                      namespace: cattle-monitoring-system
                      job: kube-etcd
                    annotations:
                      summary: One or more targets are unreachable.
      responses:
        "200":
          description: Сообщение отправлено или обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentMessage"
        "400":
          description: В запросе больше одного алерта или нет текста
        "401":
          description: Нет или неверный X-Internal-Token
  /v1/cards/links:
    post:
      tags: [alerts]
      operationId: addCardLink
      summary: Дописать ссылку SPI к уже отправленной карточке
      description: |
        Для workflow, который разбирает алерт позже и заводит GitHub issue.
        Бот находит все копии карточки и добавляет ссылку в строку ссылок, не убирая кнопки Mute.
        Повторный вызов с тем же URL ничего не дублирует. Следующее обновление алерта сохраняет ссылку.
        Если карточка ещё не отправлялась после появления этого метода, ответ 409:
        нужно дождаться следующего обновления этого алерта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardLink"
      responses:
        "200":
          description: Ссылка записана и проставлена в те копии, где это удалось
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLinkResult"
        "400":
          description: Не переданы ни key, ни alert
        "401":
          description: Нет или неверный X-Internal-Token
        "404":
          description: Карточка с таким ключом ещё не отправлялась
        "409":
          description: У карточки ещё не сохранён текст, повторите после следующего обновления алерта
  /v1/messages/{message_id}:
    patch:
      tags: [messages]
      operationId: patchMessage
      summary: Заменить текст одного сообщения
      parameters:
        - $ref: "#/components/parameters/messageId"
        - name: chat_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Сообщение изменено
        "401":
          description: Нет или неверный X-Internal-Token
  /v1/link-codes:
    post:
      tags: [vpn]
      operationId: createLinkCode
      summary: Выдать одноразовый код привязки клиента панели
      description: Код не добавляет человека в список VPN сам по себе. Список рассылки — это те, кто нажал «I use VPN».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [panel_client_id]
              properties:
                panel_client_id:
                  type: string
                ttl_seconds:
                  type: integer
                  default: 900
      responses:
        "200":
          description: Код и команда /start, которой его нужно передать
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  start:
                    type: string
                    example: link_ab12
        "401":
          description: Нет или неверный X-Internal-Token
  /v1/broadcasts:
    post:
      tags: [messages]
      operationId: createBroadcast
      summary: Создать черновик рассылки
      description: Обычная рассылка запускается командой /mailing в Telegram, не этим методом.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, chat_id]
              properties:
                text:
                  type: string
                chat_id:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Черновик создан и показан владельцу
        "401":
          description: Нет или неверный X-Internal-Token
  /v1/actions/{action_id}:
    get:
      tags: [messages]
      operationId: getAction
      summary: Статус кнопки в сообщении
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Текущий статус действия
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  result:
                    type: object
        "401":
          description: Нет или неверный X-Internal-Token
        "404":
          description: Действие не найдено
  /telegram/webhook:
    post:
      tags: [telegram]
      operationId: telegramWebhook
      summary: Принять обновление Telegram
      description: Единственный публичный метод. Его вызывает Telegram, не внутренние workflow.
      security:
        - telegramSecret: []
      servers:
        - url: https://bot.socrat.alchemmist.xyz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Update из Bot API
      responses:
        "200":
          description: Обновление принято
        "401":
          description: Секрет webhook не совпал
  /v1/cards:
    get:
      tags:
      - alerts
      operationId: listCards
      summary: Открытые карточки и их копии
      description: 'По умолчанию только ещё открытые (firing). status=resolved или status=all
        меняет выбор.

        text_stored=false значит текст карточки ещё не сохранён и ссылку или заметку
        писать рано (будет 409).

        '
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - firing
          - resolved
          - all
          default: firing
      - name: episode
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
        description: Find retained immutable SPI episode cards, including resolved with
          status=all.
      responses:
        '200':
          description: Карточки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '401':
          description: Нет или неверный X-Internal-Token
  /v1/cards/item:
    get:
      tags: [alerts]
      operationId: getCard
      summary: Одна карточка по ключу
      description: |
        Ключ берётся из списка карточек или из ответа POST /v1/messages.
        В ключе бывают слэши, поэтому он передаётся параметром key, а не частью пути.
        Возвращает и открытую, и уже закрытую карточку.
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Карточка и её копии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardSummary"
        "401":
          description: Нет или неверный X-Internal-Token
        "404":
          description: Карточка с таким ключом не отправлялась
  /v1/cards/notes:
    post:
      tags: [alerts]
      operationId: addCardNote
      summary: Дописать или заменить короткую заметку на карточке
      description: |
        Одна строка без HTML, не длиннее 240 символов. Попадает во все копии и сохраняется
        при следующем обновлении алерта. Повтор той же строки ничего не дублирует.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardNote"
      responses:
        "200":
          description: Заметка записана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLinkResult"
        "400":
          description: Нет ключа или заметка пустая либо слишком длинная
        "401":
          description: Нет или неверный X-Internal-Token
        "404":
          description: Карточка ещё не отправлялась
        "409":
          description: У карточки ещё не сохранён текст
  /v1/audience:
    get:
      tags: [alerts, vpn]
      operationId: getAudience
      summary: Кто на VPN и кто подписан на алерты
      description: |
        username без символа @. Его может не быть, тогда остаётся telegram_id.
        Список VPN — только те, кто нажал «I use VPN», не все, кто нажал /start.
      responses:
        "200":
          description: Два списка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audience"
        "401":
          description: Нет или неверный X-Internal-Token
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Процесс жив
      security: []
      responses:
        "200":
          description: Процесс отвечает
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  parameters:
    messageId:
      name: message_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Message:
      type: object
      required: [chat_id]
      properties:
        chat_id:
          type: integer
          format: int64
          description: Чат для обычного сообщения. Для алерта получатели определяются incident generation и receive_level; fallback нет.
        text:
          type: string
        alert:
          $ref: "#/components/schemas/Alert"
        alerts:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/Alert"
        card:
          $ref: "#/components/schemas/Card"
        actions:
          type: array
          items:
            type: object
        images:
          type: array
          nullable: true
          maxItems: 3
          items:
            $ref: "#/components/schemas/AlertImage"
        parse_mode:
          type: string
          enum: [HTML]
    AlertImage:
      type: object
      additionalProperties: false
      required: [data_base64, mime_type]
      properties:
        data_base64:
          type: string
          format: byte
          maxLength: 5592408
          description: Canonical strict base64; decoded limit 4 MiB, matching PNG/JPEG signature required.
        mime_type:
          type: string
          enum: [image/png, image/jpeg]
        filename:
          type: string
          nullable: true
          maxLength: 100
          pattern: '^[A-Za-z0-9_.-]{1,100}$'
    Alert:
      type: object
      properties:
        status:
          type: string
          enum:
          - firing
          - resolved
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        fingerprint:
          type: string
        spi_episode:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Authoritative SPI episode digest. Creates an immutable episode-specific
            card key; firing/resolved share it, later firings use a new key.
    Card:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
        title:
          type: string
        where:
          type: string
        summary:
          type: string
        status:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          items:
            type: string
          description: Имена провайдеров ссылок, например alert, rancher, logs.
        hrefs:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label:
                type: string
              url:
                type: string
    CardLink:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
        label:
          type: string
          default: SPI
        key:
          type: string
          description: Ключ карточки, если он уже известен.
        alert:
          $ref: '#/components/schemas/Alert'
        revision:
          type: integer
          minimum: 1
          description: Monotonic desired-link revision; stale revisions return409. Requires expected_copies.
        expected_copies:
          type: array
          maxItems: 1000
          items:
            type: object
            required:
            - chat_id
            - message_id
            properties:
              chat_id:
                type: integer
              message_id:
                type: integer
          description: 'Optional atomic guard: all listed chat/message identities must
            still belong to this card, otherwise409.'
    CardLinkResult:
      type: object
      properties:
        key:
          type: string
        updated:
          type: array
          items:
            type: object
            properties:
              chat_id:
                type: integer
                format: int64
              message_id:
                type: integer
                format: int64
        pending:
          type: array
          items:
            type: object
            required:
            - chat_id
            - message_id
            properties:
              chat_id:
                type: integer
              message_id:
                type: integer
          description: Copies not acknowledged by Telegram; retry even on HTTP200.
    SentMessage:
      type: object
      properties:
        attachments:
          type: array
          description: Present when retained images exist; text copies do not imply photo success. Slots are zero-based. Pending includes failed/disabled recipients; no bytes are exposed.
          items:
            type: object
            required: [chat_id, slot, status]
            properties:
              chat_id:
                type: integer
                format: int64
              slot:
                type: integer
                minimum: 0
                maximum: 2
              status:
                type: string
                enum: [pending, sent, superseded]
              message_id:
                type: integer
                nullable: true
                description: Existing photo ID, not proof of snapshot delivery. Status describes submitted generation and slot revision; superseded means that generation or revision is no longer desired. Omitted/null/empty images do not drain media; provided images attempt at most one photo within a two-second synchronous budget.

        id:
          type: integer
          format: int64
        chat_id:
          type: integer
          format: int64
        replayed:
          type: boolean
        key:
          type: string
          description: Ключ карточки. Для обычного сообщения нет.
        copies:
          type: array
          description: Завершённые копии. Пусто, если нет допустимых получателей; незавершённая доставка сохраняется для durable retry.
          items:
            type: object
            required:
            - chat_id
            - message_id
            properties:
              chat_id:
                type: integer
                format: int64
              message_id:
                type: integer
                format: int64
              replayed:
                type: boolean
        episode:
          type: string
        immutable_key:
          type: boolean
    CardNote:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 240
        key:
          type: string
        alert:
          $ref: "#/components/schemas/Alert"
    CardSummary:
      type: object
      required: [key, status, copies]
      properties:
        key:
          type: string
        generation:
          type: integer
        level:
          type: integer
          nullable: true
        escalation_history:
          type: array
          items:
            type: object
            properties:
              from:
                type: integer
              level:
                type: integer
              actor:
                type: integer
                format: int64
              at:
                type: string
                format: date-time
        status:
          type: string
          enum: [firing, resolved]
        text_stored:
          type: boolean
        spi_url:
          type: string
          nullable: true
        spi_label:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        copies:
          type: array
          items:
            type: object
            properties:
              chat_id:
                type: integer
                format: int64
              message_id:
                type: integer
                format: int64
                nullable: true
              generation:
                type: integer
              status:
                type: string
              text_stored:
                  type: boolean
    CardList:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardSummary"
    Audience:
      type: object
      properties:
        vpn:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    Person:
      type: object
      required: [telegram_id]
      properties:
        telegram_id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        admin_level:
          type: integer
          description: Assigned authority tier; lower numbers have higher authority.
        receive_level:
          type: integer
          description: New firing delivery threshold, greater than or equal to admin_level.
